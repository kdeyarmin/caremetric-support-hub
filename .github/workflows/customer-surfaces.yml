name: External customer surface monitoring
on:
  workflow_dispatch:
  schedule:
    # Hourly. Every 15 minutes billed a full Actions minute each run for a check that takes about
    # 10 seconds: about 2,900 billed minutes a month. Off the top of the hour, when GitHub's
    # scheduler is busiest.
    - cron: '7 * * * *'
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubicloud-standard-2
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-customer-surfaces.mjs
