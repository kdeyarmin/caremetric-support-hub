name: Support Hub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Docker Hub rate-limits anonymous pulls from shared runners (HTTP 429). Google's Docker Hub
      # mirror serves the same official image; the build then resolves the local tag. If the
      # mirror is unavailable, the build pulls from Docker Hub as before.
      - name: Pull the Node base image through a registry mirror
        run: |
          docker pull mirror.gcr.io/library/node:24-alpine && docker tag mirror.gcr.io/library/node:24-alpine node:24-alpine \
            || echo 'Mirror unavailable; the build will pull node:24-alpine from Docker Hub.'
      - name: Build the actual runtime image with synthetic frontend configuration
        run: docker build --build-arg VITE_DEMO_MODE=true --build-arg SUPPORT_HUB_ALLOW_DEMO_BUILD=true -t hub-runtime-check .
      - name: Resolve the complete startup module graph inside the production image
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network none hub-runtime-check > runtime-startup.log 2>&1
          result=$?
          set -e
          # No credentials or network are supplied. A fully packaged runtime
          # must reach configuration validation, after all static imports load.
          if [ "$result" -ne 1 ] || ! grep -Fq 'HUB_DATABASE_URL must be a valid private PostgreSQL connection URL.' runtime-startup.log; then
            cat runtime-startup.log
            echo 'Runtime image did not reach the expected configuration boundary.'
            exit 1
          fi
          echo 'Runtime image resolved startup imports and rejected missing configuration.'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPPORT_HUB_ALLOW_DEMO_BUILD: "true"
      VITE_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check administrator Edge Function
        run: |
          deno check supabase/functions/platform-admin/index.ts supabase/functions/platform-command/index.ts supabase/functions/app-media/index.ts
          deno check supabase/functions/publication-media/index.ts
          deno check --config supabase/functions/learning-receipts/deno.json supabase/functions/learning-receipts/index.ts
      - name: Verify connected builds fail closed without backend configuration
        run: |
          if env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY VITE_DEMO_MODE=false npm run build; then
            echo "Connected build unexpectedly succeeded without Supabase configuration"
            exit 1
          fi
      - name: Verify production builds reject demo mode
        run: |
          if env -u SUPPORT_HUB_ALLOW_DEMO_BUILD VITE_DEMO_MODE=true npm run build; then
            echo "Production build unexpectedly accepted demo mode"
            exit 1
          fi
      - run: npm run check
      - run: node scripts/evaluate-growth.mjs

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize ephemeral Supabase configuration
        run: npx supabase init
      - name: Start isolated Supabase stack
        run: npm run supabase:start
      - name: Run pgTAP security contracts
        run: npm run supabase:test
      - name: Exercise app SMS sessions through PostgreSQL and HTTP
        env:
          HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          node server/integration.mjs
          node server/owner-access-integration.mjs
          node server/advisors-integration.mjs
          node server/communications-integration.mjs
          # Repeat with the same fixtures to prove complete teardown.
          node server/communications-integration.mjs
          node server/bulk-email-integration.mjs
          # Repeat with fresh fixtures to prove complete teardown.
          node server/bulk-email-integration.mjs
          node server/operations-integration.mjs
          node server/configuration-integration.mjs
          node server/training-integration.mjs
          # Repeat with the same fixture identity to prove complete teardown.
          node server/configuration-integration.mjs
          node server/learning-integration.mjs
          node server/support-integration.mjs
          node server/phone-registry-integration.mjs
          node server/billing-integration.mjs
          # Repeat with fresh fixtures to prove complete teardown.
          node server/billing-integration.mjs
          node server/self-service-integration.mjs
          node server/self-service-integration.mjs
          node server/onboarding-integration.mjs
          node server/registration-integration.mjs
          node server/authoring-integration.mjs
          node server/generated-course-integration.mjs
          node server/package-integration.mjs
          node server/pennsync-migration-integration.mjs
          node server/distribution-integration.mjs
          node server/distribution-contract-integration.mjs
          node server/credit-policy-contract-integration.mjs
          node server/provider-integration.mjs
          node server/catalog-integration.mjs
          node server/generation-integration.mjs
          node server/course-media-integration.mjs
          node server/media-contract-integration.mjs
          node server/creation-integration.mjs
          node server/creation-contract-integration.mjs
          node server/publication-integration.mjs
          node server/backend-contract-integration.mjs
          node server/ai-automation-integration.mjs
          node server/agents-integration.mjs
          # Repeat to prove complete teardown.
          node server/agents-integration.mjs
          node server/agents-concierge-integration.mjs
          node server/agents-concierge-integration.mjs
          node server/agents-runtime-integration.mjs
          node server/agents-runtime-integration.mjs
          node server/agents-concierge-drafting-integration.mjs
          node server/agents-concierge-drafting-integration.mjs
          node server/agents-accounts-integration.mjs
          node server/agents-accounts-integration.mjs
          node server/agents-hardening-integration.mjs
          node server/agents-hardening-integration.mjs
          node server/leads-integration.mjs
          # Repeat with fresh keys to prove complete teardown.
          node server/leads-integration.mjs
          node server/agents-growth-integration.mjs
          # Repeat with fresh keys to prove complete teardown.
          node server/agents-growth-integration.mjs
          node server/agents-lifecycle-integration.mjs
          node server/agents-lifecycle-integration.mjs
          node server/agents-external-email-integration.mjs
          # Repeat with fresh request keys to verify teardown and duplicate-send protections.
          node server/agents-external-email-integration.mjs
          node server/agents-content-integration.mjs
          node server/agents-content-integration.mjs
          node server/growth-integration.mjs
          node server/growth-integration.mjs
          node server/agents-autonomy-integration.mjs
          node server/agents-autonomy-integration.mjs
          node server/agents-answers-integration.mjs
          node server/agents-answers-integration.mjs
          node server/agents-growth-autonomy-integration.mjs
          node server/agents-growth-autonomy-integration.mjs
          node server/agents-offers-integration.mjs
          node server/agents-offers-integration.mjs
      - name: Export, lose and restore disposable Hub data
        env:
          HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          HUB_RUN_RECOVERY_DRILL: disposable-data-loss
        run: node server/recovery-integration.mjs
      - name: Restore exact private Storage object bytes
        env:
          HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          HUB_RUN_STORAGE_RECOVERY_DRILL: disposable-object-loss
        run: |
          node server/storage-recovery-integration.mjs
      - name: Check database security and performance advisors
        run: npx supabase db advisors --local --type all --level warn --fail-on error
      - name: Stop isolated Supabase stack
        if: always()
        run: npm run supabase:stop -- --no-backup
