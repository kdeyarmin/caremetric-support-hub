name: Support Hub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual runtime image with synthetic frontend configuration
        run: docker build --build-arg VITE_DEMO_MODE=true --build-arg SUPPORT_HUB_ALLOW_DEMO_BUILD=true -t hub-runtime-check .
      - name: Resolve the complete startup module graph inside the production image
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network none hub-runtime-check > runtime-startup.log 2>&1
          result=$?
          set -e
          # No credentials or network are supplied. A fully packaged runtime
          # must reach configuration validation, after all static imports load.
          if [ "$result" -ne 1 ] || ! grep -Fq 'HUB_DATABASE_URL must be a valid private PostgreSQL connection URL.' runtime-startup.log; then
            cat runtime-startup.log
            echo 'Runtime image did not reach the expected configuration boundary.'
            exit 1
          fi
          echo 'Runtime image resolved startup imports and rejected missing configuration.'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPPORT_HUB_ALLOW_DEMO_BUILD: "true"
      VITE_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check administrator Edge Function
        run: |
          deno check supabase/functions/platform-admin/index.ts supabase/functions/platform-command/index.ts supabase/functions/app-media/index.ts
          deno check supabase/functions/publication-media/index.ts
          deno check --config supabase/functions/learning-receipts/deno.json supabase/functions/learning-receipts/index.ts
      - name: Verify connected builds fail closed without backend configuration
        run: |
          if env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY VITE_DEMO_MODE=false npm run build; then
            echo "Connected build unexpectedly succeeded without Supabase configuration"
            exit 1
          fi
      - name: Verify production builds reject demo mode
        run: |
          if env -u SUPPORT_HUB_ALLOW_DEMO_BUILD VITE_DEMO_MODE=true npm run build; then
            echo "Production build unexpectedly accepted demo mode"
            exit 1
          fi
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize ephemeral Supabase configuration
        run: npx supabase init
      - name: Start isolated Supabase stack
        run: npm run supabase:start
      - name: Run pgTAP security contracts
        run: npm run supabase:test
      - name: Exercise app SMS sessions through PostgreSQL and HTTP
        env:
          HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          node server/integration.mjs
          node server/learning-integration.mjs
          node server/support-integration.mjs
          node server/onboarding-integration.mjs
          node server/registration-integration.mjs
          node server/authoring-integration.mjs
          node server/publication-integration.mjs
          node server/backend-contract-integration.mjs
          node server/billing-command-integration.mjs
          node server/billing-contract-integration.mjs
      - name: Export, lose and restore disposable Hub data
        env:
          HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          HUB_RUN_RECOVERY_DRILL: disposable-data-loss
        run: node server/recovery-integration.mjs
      - name: Restore exact private Storage object bytes
        env:
          HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          HUB_RUN_STORAGE_RECOVERY_DRILL: disposable-object-loss
        run: node server/storage-recovery-integration.mjs
      - name: Check database security and performance advisors
        run: npx supabase db advisors --local --type all --level warn --fail-on error
      - name: Stop isolated Supabase stack
        if: always()
        run: npm run supabase:stop -- --no-backup
