name: Support Hub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize ephemeral Supabase configuration
        run: npx supabase init
      - name: Start isolated Supabase stack
        run: npm run supabase:start
      - name: Run pgTAP security contracts
        run: npm run supabase:test
      - name: Stop isolated Supabase stack
        if: always()
        run: npm run supabase:stop -- --no-backup
